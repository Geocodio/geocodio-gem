name: Publish to RubyGems

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # RubyGems trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rubygems

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Verify tag matches gem version
        run: |
          GEM_VERSION="$(ruby -r ./lib/geocodio/gem/version -e 'print Geocodio::VERSION')"
          if [ "v${GEM_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Geocodio::VERSION ${GEM_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: |
          gem install bundler
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: Run tests
        run: |
          echo "API_KEY=${{ secrets.GEOCODIO_API_KEY }}" > .env
          bundle exec rspec

      # Build with gem build/push rather than `rake release`, which tries to
      # create and push the tag itself.
      - name: Build gem
        run: gem build geocodio-gem.gemspec

      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v1.0.0

      - name: Publish
        run: gem push "geocodio-gem-${GITHUB_REF_NAME#v}.gem"
